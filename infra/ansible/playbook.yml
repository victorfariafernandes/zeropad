---
- name: Configure k3s servers
  hosts: k3s_server
  become: true
  vars:
    block_device: /dev/sdb
    data_mount: /data
  roles:
    - role: volume
      tags: [volume, k3s]
    - role: k3s-server
      tags: [k3s]

- name: Configure k3s agents
  hosts: k3s_agent
  become: true
  vars:
    k3s_server_host: "{{ hostvars[groups['k3s_server'][0]]['ansible_host'] }}"
  roles:
    - role: k3s-agent
      tags: [k3s]

- name: Deploy application
  hosts: k3s_server
  become: true
  vars:
    domain: "zeropad.dev"
    github_owner: "victorfariafernandes"
  roles:
    - role: k8s-manifests
      tags: [deploy]
