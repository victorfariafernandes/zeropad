---
- name: Disable and stop firewalld
  systemd:
    name: firewalld
    state: stopped
    enabled: false
  ignore_errors: true

- name: Install k3s agent
  shell: |
    curl -sfL https://get.k3s.io | \
      K3S_URL="https://{{ k3s_server_host }}:6443" \
      K3S_TOKEN="{{ hostvars[groups['k3s_server'][0]]['k3s_node_token'] }}" \
      INSTALL_K3S_EXEC="agent --node-name=zeropad-worker" \
      sh -
  args:
    creates: /usr/local/bin/k3s

- name: Enable and start k3s-agent service
  systemd:
    name: k3s-agent
    state: started
    enabled: true
