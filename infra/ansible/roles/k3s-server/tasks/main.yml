---
- name: Disable and stop firewalld
  systemd:
    name: firewalld
    state: stopped
    enabled: false
  ignore_errors: true

- name: Install k3s server
  shell: |
    curl -sfL https://get.k3s.io | INSTALL_K3S_EXEC="server \
      --disable=traefik \
      --node-name=zeropad-server \
      --write-kubeconfig-mode=644" sh -
  args:
    creates: /usr/local/bin/k3s

- name: Enable and start k3s service
  systemd:
    name: k3s
    state: started
    enabled: true

- name: Wait for k3s API to be ready
  command: /usr/local/bin/k3s kubectl get nodes
  register: k3s_nodes
  retries: 12
  delay: 10
  until: k3s_nodes.rc == 0

- name: Read k3s node join token
  slurp:
    src: /var/lib/rancher/k3s/server/node-token
  register: k3s_token_raw

- name: Set k3s node token fact
  set_fact:
    k3s_node_token: "{{ k3s_token_raw.content | b64decode | trim }}"
