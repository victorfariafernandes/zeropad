apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: zeropad
  namespace: zeropad
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
spec:
  ingressClassName: nginx
  tls:
    - secretName: zeropad-origin-tls
      hosts:
        - zeropad.dev
        - api.zeropad.dev
  rules:
    - host: zeropad.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
    - host: api.zeropad.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8080
