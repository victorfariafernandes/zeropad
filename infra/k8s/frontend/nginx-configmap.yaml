apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-frontend-config
  namespace: zeropad
data:
  default.conf: |
    server {
      listen 80;
      root /usr/share/nginx/html;
      index index.html;

      # System pages served from /system/ directory
      location ^~ /_/ {
        rewrite ^/_/(.*)$ /system/$1 last;
      }

      location /system/ {
        try_files $uri $uri.html $uri/index.html =404;
      }

      # Unknown .txt pad paths fall back to _.txt
      location ~ ^/[^/]+\.txt$ {
        try_files $uri /_.txt;
      }

      # All other non-file paths fall back to _.html (SPA-style)
      location / {
        try_files $uri $uri/index.html /_.html;
      }
    }
